  <path d="M490,86 L490,112" class="arrow"/>
  <text x="788" y="54" text-anchor="start" class="small" xml:space="preserve">all 8 lanes in</text>
  <text x="788" y="68" text-anchor="start" class="small" xml:space="preserve">one register</text>
  <rect x="20" y="346" width="940" height="70" rx="6" fill="#f1f3f4" stroke="#80868b" stroke-width="1.4"/>
  <text x="34" y="368" text-anchor="start" class="sub" xml:space="preserve">A comparison does not produce 0.0 or 1.0: it produces a mask, a lane that is all one bits (which, read as a float, is NaN) or all zero bits.</text>
  <text x="34" y="386" text-anchor="start" class="sub" xml:space="preserve">? : and &amp;&amp; || ! consume masks directly (vblendvps / and / or). Assigning a comparison to an attribute converts it to 1.0 / 0.0 first.</text>
  <text x="34" y="404" text-anchor="start" class="sub" xml:space="preserve">So  y = x &gt; 3;  stores 0/1, but  y = (x &gt; 3) + 1;  is NaN for true lanes. Write  y = (x &gt; 3 ? 1 : 0) + 1;  instead.</text>
</svg>
