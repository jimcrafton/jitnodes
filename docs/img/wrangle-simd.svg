  <text x="20" y="194" text-anchor="start" class="mono" xml:space="preserve">mask bits</text>
  <text x="20" y="254" text-anchor="start" class="mono" xml:space="preserve">100 | 0</text>
  <text x="20" y="314" text-anchor="start" class="mono" xml:space="preserve">y = select</text>
