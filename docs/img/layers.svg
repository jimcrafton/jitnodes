<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img">
  <title>jitnodes layers</title>
  <desc>Front ends use the graph layer, which uses the jit and geo layers, which sit on the core layer.</desc>

  <style>
    text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; fill: #202124; font-size: 13px; }
    .title { font-size: 17px; font-weight: 600; }
    .sub { font-size: 12px; fill: #5f6368; }
    .small { font-size: 11px; fill: #5f6368; }
    .mono { white-space: pre; font-family: Consolas, "Cascadia Mono", "Courier New", monospace; font-size: 12px; }
    .bold { font-weight: 600; }
    .white { fill: #ffffff; }
    .arrow { stroke: #5f6368; stroke-width: 1.6; fill: none; marker-end: url(#head); }
    .line { stroke: #5f6368; stroke-width: 1.4; fill: none; }
    .dash { stroke: #80868b; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
